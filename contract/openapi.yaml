        total_km: 23536
        earth_laps: 0.59
        longest_trip_route: "Mumbai to Varanasi"
        longest_trip_km: 1561
        shortest_trip_route: "Mumbai to Hyderabad"
        shortest_trip_km: 777
        avg_trip_km: 1384
