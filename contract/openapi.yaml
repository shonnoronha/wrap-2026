    # ---- end of generated PipelineRow ----

    # ---- Page payloads (value of WrapPage.data, keyed by WrapPage.type) ----
    PageDataINTRO:
      type: object
      properties: { year: { type: integer }, totalTrips: { type: integer } }
    PageDataFIRST_STEPS:
      type: object
      properties: { trips: { type: integer }, from: { type: string }, to: { type: string }, date: { type: string } }
    PageDataODOMETER:
      type: object
      properties:
        totalKm: { type: integer }
        busTrips: { type: integer }
        trainTrips: { type: integer }
        cities: { type: array, items: { $ref: '#/components/schemas/City' } }
        legs:
          type: array
          items:
            type: object
            properties:
              from: { type: string, description: City code }
              to: { type: string }
              mode: { type: string, enum: [BUS, TRAIN] }
              count: { type: integer }
        equivalent:
          type: object
          properties: { label: { type: string }, times: { type: number } }
        insight: { $ref: '#/components/schemas/InsightData' }
    PageDataPEAK_MONTH:
      type: object
      properties:
        monthly: { type: array, items: { type: integer }, minItems: 12, maxItems: 12 }
        peakMonthIndex: { type: integer, minimum: 0, maximum: 11 }
        peakTrips: { type: integer }
        longestGapDays: { type: integer }
    PageDataTOP_ROUTE:
      type: object
      properties: { from: { type: string }, to: { type: string }, count: { type: integer }, topPercentOnRoute: { type: number }, rankOnRoute: { type: integer, description: '1.1: user rank among travellers on this route (top_route_rank); set instead of topPercentOnRoute' }, insight: { $ref: '#/components/schemas/InsightData' } }
    PageDataNIGHT_OWL:
      type: object
      properties: { nights: { type: integer }, nightSharePct: { type: integer }, sunrises: { type: integer, description: Optional in 1.1 }, usualDeparture: { type: string }, insight: { $ref: '#/components/schemas/InsightData' } }
    PageDataEARLY_BIRD:
      type: object
      properties: { morningSharePct: { type: integer }, earliestDeparture: { type: string }, trips: { type: integer } }
    PageDataSEAT:
      type: object
      properties: { seatLabel: { type: string }, count: { type: integer }, windowPct: { type: integer }, berth: { type: string, enum: [LOWER, UPPER, SEATER] } }
    PageDataRAIL:
      type: object
      properties: { trips: { type: integer }, km: { type: integer }, longestHours: { type: number }, topClass: { type: string } }
    PageDataWAITLIST:
      type: object
      properties: { confirmed: { type: integer }, path: { type: array, items: { type: string } }, pnrChecks: { type: integer } }
    PageDataLAST_MINUTE:
      type: object
      properties: { minLeadMinutes: { type: integer }, avgLeadHours: { type: number }, insight: { $ref: '#/components/schemas/InsightData' } }
    PageDataPLANNER:
      type: object
      properties: { avgLeadDays: { type: integer }, earliestDays: { type: integer, description: Optional in 1.1 }, insight: { $ref: '#/components/schemas/InsightData' } }
    PageDataFLEXI:
      type: object
      properties:
        dateChanges: { type: integer }
        freeCancellations: { type: integer }
        feesSaved: { type: integer }
        from: { type: string }
        to: { type: string }
        dates: { type: array, items: { type: string }, description: Original date first, then each change }
    PageDataLIVE_TRACKING:
      type: object
      properties:
        checks: { type: integer }
        shares: { type: integer }
        onTimePct: { type: integer }
        from: { type: string }
        to: { type: string }
        stops: { type: array, items: { type: object, properties: { name: { type: string }, time: { type: string } } } }
    PageDataHOTEL:
      type: object
      description: Shown only when the user has at least one hotel stay; never dropped by the page cap.
      properties:
        stays: { type: integer, description: Hotel bookings stayed (not cancelled) }
        nights: { type: integer, description: Total nights across those stays }
        cities: { type: array, items: { type: string }, description: Cities the user stayed in }
        topCity: { type: string, description: City with the most nights }
        comboTrips: { type: integer, description: Stays booked for the destination of one of the user's bus or train journeys }
        longestStayNights: { type: integer }
    PageDataHOMEWARD:
      type: object
      properties: { tripsHome: { type: integer }, hometown: { type: string }, festivals: { type: array, items: { type: string } }, avgLeadDays: { type: integer } }
    PageDataEXPLORER:
      type: object
      properties: { newCities: { type: array, items: { type: string } }, states: { type: integer } }
    PageDataSQUAD:
      type: object
      properties: { groupBookings: { type: integer }, largestGroup: { type: integer }, seatsBooked: { type: integer } }
    PageDataSAVINGS:
      type: object
      properties: { saved: { type: integer }, chais: { type: integer }, bestDeal: { type: integer }, coupons: { type: integer, description: Optional in 1.1 }, insight: { $ref: '#/components/schemas/InsightData' } }
    PageDataPRIMO:
      type: object
      properties: { rides: { type: integer }, avgRatingGiven: { type: number } }
    PageDataECO:
      type: object
      properties: { co2Kg: { type: integer }, trees: { type: integer }, insight: { $ref: '#/components/schemas/InsightData' } }
    PageDataDREAM:
      type: object
      properties: { destination: { type: string }, searches: { type: integer } }
    PageDataPERSONA:
      type: object
      properties: { personaId: { type: string }, title: { type: string }, traits: { type: array, items: { type: string } } }
    PageDataSUMMARY:
      type: object
      properties:
        stats: { type: array, items: { $ref: '#/components/schemas/Stat' } }
        prediction:
          type: object
          properties: { destination: { type: string }, by: { type: string } }
    PageDataSTREAK:
      description: Longest run of weeks or months with a trip (streak_weeks, streak_months, longest_gap_days).
      allOf: [{ $ref: '#/components/schemas/InsightData' }]
    PageDataRHYTHM:
      description: Weekly pattern. Weekend share as hero, weekly_heatmap as heatmap, favourite day and busiest month as facts.
      allOf: [{ $ref: '#/components/schemas/InsightData' }]
    PageDataOPERATOR:
      description: Favourite operator, bus type and seat. Sleeper share as hero.
      allOf: [{ $ref: '#/components/schemas/InsightData' }]
    PageDataGROWTH:
      description: Trips versus 2025 and trips percentile. compare is last year vs this year.
      allOf: [{ $ref: '#/components/schemas/InsightData' }]
    PageDataEXTREMES:
      description: Longest and shortest trip. compare is shortest vs longest; route is the longest route.
      allOf: [{ $ref: '#/components/schemas/InsightData' }]
    PageDataPLACES:
      description: Unique, new, rarest and farthest cities. stamps lists city names.
      allOf: [{ $ref: '#/components/schemas/InsightData' }]
    PageDataSIGNATURE:
      description: signature_trip from the pipeline as quote, with top route and usual departure as facts.
      allOf: [{ $ref: '#/components/schemas/InsightData' }]
    PageDataFIRST_AND_LAST:
      description: First and latest trip of the year. compare is first vs latest destination.
      allOf: [{ $ref: '#/components/schemas/InsightData' }]
    PageDataTRAIN:
      type: object
      description: PROPOSED (dummy data only until a rail feed exists). Year on trains; drawn as coaches, a PNR slip (needs wlPath) or a sleeper berth.
      required: [trips, km, from, to, topClass, favBerth, nightTrains, longestHours, waitlistConfirmed]
      properties:
        trips: { type: integer }
        km: { type: integer }
        from: { type: string }
        to: { type: string }
        topClass: { type: string, example: 3A }
        favBerth: { type: string, enum: [LB, MB, UB, SL, SU] }
        nightTrains: { type: integer }
        longestHours: { type: number }
        waitlistConfirmed: { type: integer }
        wlPath: { type: array, items: { type: string }, example: [WL 18, WL 7, RAC 4, CNF] }
    PageDataHOTEL_STAY:
      type: object
      description: PROPOSED (dummy data only until a hotel feed exists). Nights away; drawn as a key card and door, a lit-up hotel tower, or luggage tags (needs 2+ cities).
      required: [stays, nights, cities, topCity, longestStayNights, comboTrips]
      properties:
        stays: { type: integer }
        nights: { type: integer }
        cities: { type: array, maxItems: 4, items: { type: object, required: [name, nights], properties: { name: { type: string }, nights: { type: integer } } } }
        topCity: { type: string }
        longestStayNights: { type: integer }
        comboTrips: { type: integer, description: Trips where a bus and a hotel were booked together }
