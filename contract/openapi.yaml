openapi: 3.0.3
info:
  title: Wrap API
  version: 1.1.0
  description: |
    Returns a user's year-in-travel wrap as an ordered list of pages.

    Design rules:
    - The request carries only `userId` (the integer rb_user_id). Everything else (year, locale, which
      pages, copy) is decided on the server.
    - The server decides which pages a user sees. A user with 2 trips gets a
      short wrap; a heavy traveller gets up to 12 content pages, ranked by how
      interesting each one is for that user.
    - Each page has a `type`, a `dwellMs` (reading time after its animation ends), server-resolved `copy` and a
      typed `data` payload. Clients render by `type` and silently skip types
      they don't recognise, so new page types can ship server-side first.
    - Numbers in `data` drive animations (Rive state-machine inputs on
      Android, React components on web). Text in `copy` is shown as-is.

    Schema 1.1 (unique wraps per user):
    - Wraps are composed once per user by a batch job from the 68-column
      pipeline row (`PipelineRow`) and stored; this endpoint serves the stored
      wrap. Card mix, order, copy and look are picked per user, seeded by
      `rb_user_id`, so similar travellers still get different wraps.
    - Each page may carry `variant` (`layout`, `palette`, `mascotMood`).
      `layout: default` is the type's own animated page; any other layout is
      drawn by the shared insight renderer from `InsightData`.
    - New page types STREAK, RHYTHM, OPERATOR, GROWTH, EXTREMES, PLACES,
      SIGNATURE and FIRST_AND_LAST all use `InsightData`.
    - Classic types ODOMETER, TOP_ROUTE, NIGHT_OWL, LAST_MINUTE, PLANNER,
      SAVINGS and ECO may get a non-default layout; their `data` then also
      carries `insight` (InsightData) for it.
    - All 1.1 additions are optional or new types, so 1.0 clients keep working.
servers:
  - url: /
    description: Same origin as the docs page (API on :8787, or through the Vite proxy on :5173)
paths:
  /api/v1/wrap:
    post:
      operationId: getWrap
      summary: Get the wrap for one user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrapRequest'
            example: { userId: 42 }
      responses:
        '200':
          description: The user's wrap
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WrapResponse' }
        '400':
          description: Body missing, has extra fields, or userId is not a positive integer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Unknown userId (the dummy server has users 1 to 400; anything above is 404)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: User has no trips this year, so there is no wrap
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
components:
  schemas:
    WrapRequest:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId: { type: integer, format: int64, minimum: 1, example: 42, description: 'rb_user_id. The dummy server has users 1 to 400.' }
    WrapResponse:
      type: object
      required: [schemaVersion, wrapId, userId, year, generatedAt, locale, currency, user, pages, share]
      properties:
        schemaVersion: { type: string, enum: ['1.0', '1.1'], description: '1.1 adds `variant` on pages and the insight page types' }
        wrapId: { type: string, example: wrap_2026_42 }
        userId: { type: integer, format: int64, description: rb_user_id from the request }
        year: { type: integer }
        generatedAt: { type: string, format: date-time }
        locale: { type: string, example: en-IN }
        currency: { type: string, enum: [INR] }
        user:
          type: object
          required: [firstName, memberSince]
          properties:
            firstName: { type: string, nullable: true, description: 'Null when the data source has no name (the data API does not carry one).' }
            memberSince: { type: integer }
        pages:
          type: array
          items: { $ref: '#/components/schemas/WrapPage' }
        share: { $ref: '#/components/schemas/ShareCard' }
    WrapPage:
      type: object
      required: [id, type, dwellMs, copy, data]
      properties:
        id: { type: string }
        type:
          type: string
          description: Page kind. The shape of `data` depends on it (see PageData*). Unknown values must be skipped by clients.
          enum: [INTRO, FIRST_STEPS, ODOMETER, PEAK_MONTH, TOP_ROUTE, NIGHT_OWL, EARLY_BIRD, SEAT, RAIL, WAITLIST,
                 LAST_MINUTE, PLANNER, FLEXI, LIVE_TRACKING, HOMEWARD, HOTEL, EXPLORER, SQUAD, SAVINGS, PRIMO, ECO, DREAM,
                 PERSONA, SUMMARY, STREAK, RHYTHM, OPERATOR, GROWTH, EXTREMES, PLACES, SIGNATURE, FIRST_AND_LAST, TRAIN, HOTEL_STAY]
        dwellMs:
          type: integer
          description: |
            Reading time. The client starts this timer only after the page's entrance
            animation has finished, then auto-advances. Taps still move on at any time.
        copy: { $ref: '#/components/schemas/Copy' }
        data:
          type: object
          description: One of the PageData* schemas, chosen by `type`. Insight types (STREAK … FIRST_AND_LAST) all use InsightData.
        variant: { $ref: '#/components/schemas/Variant' }
      discriminator:
        propertyName: type
    Variant:
      type: object
      description: |
        (1.1) How this page should look for this user, picked by the composer.
        Clients render `layout` if they ship it and otherwise fall back to the
        type's default look. Optional; 1.0 clients ignore it. When a classic type
        (ODOMETER, TOP_ROUTE, …) gets a non-default layout, its `data` also carries
        `insight` (InsightData) for that layout.
      required: [layout]
      properties:
        layout: { type: string, enum: [default, big_number, ticket, stack, heatmap, ring, tiles, versus, route, passport, gauge, rollers, flipboard, scratch, trophy, pictogram, receipt, columns, timeline, chat, polaroid, podium, postcard, calendar, coaches, pnr, berth, keycard, skyline, luggage], description: 'TRAIN uses coaches | pnr | berth; HOTEL_STAY uses keycard | skyline | luggage. The generic layouts (gauge … calendar, server/wrap/layouts.mjs) can go on any card with an insight payload, including TRAIN and HOTEL_STAY, which then carry data.insight. Clients fall back to the type default for a layout they do not know.' }
        palette: { type: string, enum: [red, ink, mist, blush, night, sun, green] }
        mascotMood: { type: string, enum: [happy, wow, cheeky, love, cool, sleepy, sad] }
    InsightData:
      type: object
      required: [facts]
      properties:
        hero:
          type: object
          required: [value]
          properties: { value: { type: number }, prefix: { type: string }, suffix: { type: string }, label: { type: string }, decimals: { type: integer } }
        facts: { type: array, items: { $ref: '#/components/schemas/Stat' } }
        heatmap: { type: array, items: { type: integer }, minItems: 7, maxItems: 7, description: Trips per weekday, Monday first }
        weeks: { type: array, items: { type: integer }, minItems: 53, maxItems: 53, description: 'Trips per week of the year, week 1 first (from weekly_heatmap). The heatmap layout draws weeks when present.' }
        quote: { type: string, description: Sentence shown as the main visual (SIGNATURE) }
        compare: { type: array, items: { $ref: '#/components/schemas/Stat' }, minItems: 2, maxItems: 2, description: Two values side by side (versus layout) }
        route:
          type: object
          description: Endpoints for the route layout
          properties: { from: { type: string }, to: { type: string } }
        stamps: { type: array, items: { type: string }, description: Short strings drawn as passport stamps }
    Copy:
      type: object
      required: [kicker, headline]
      properties:
        kicker: { type: string }
        headline: { type: string }
        body: { type: string }
        bubble: { type: string, description: Line the mascot says }
    Stat:
      type: object
      required: [label, value]
      properties: { label: { type: string }, value: { type: string } }
    City:
      type: object
      required: [code, name, lat, lon]
      properties: { code: { type: string }, name: { type: string }, lat: { type: number }, lon: { type: number } }
    ShareCard:
      type: object
      required: [personaTitle, stats]
      properties:
        personaTitle: { type: string }
        stats: { type: array, items: { $ref: '#/components/schemas/Stat' } }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [BAD_REQUEST, USER_NOT_FOUND, NOT_ENOUGH_DATA, INTERNAL] }
            message: { type: string }

    # ---- Pipeline input: GENERATED by scripts/gen-row-contract.mjs, do not edit by hand ----
    PipelineRow:
      type: object
      description: |
        One row of serving.india_bus_wrap_2026 (analytics.india_bus_wrap_2026), as returned by the data
        serving API: GET {WRAP_DATA_API_URL}/wrap/{rb_user_id} with a bearer token. The wrap
        server fetches it server-side, adapts it (server/wrap/facts.mjs) and composes the
        WrapResponse the apps render. Not returned by POST /api/v1/wrap.
        India B2C Bus Wrap 2026. One row per logged-in user (rb_user_id) with more than 20 confirmed India bus trips in calendar year 2026 (IST). Confirmed booking = transaction.bus_ticket_events event_type=101, country_code=IND, operator_id not in (15926,19715). Future journeys included; cancelled bookings still counted as trips. Built by Athena aggregation then written to Iceberg and Postgres for GET /wrap/{rb_user_id}.
        Extra columns the table adds later are allowed and ignored until the adapter uses them.
      required: [rb_user_id, trips, seats_booked, trips_2025, trips_change_pct, busiest_month, longest_gap_days, streak_days, streak_weeks, streak_months, trips_percentile, first_trip_date, first_trip_route, last_trip_date, last_trip_route, total_km, earth_laps, longest_trip_route, longest_trip_km, shortest_trip_route, shortest_trip_km, avg_trip_km, km_estimated_trips, unique_cities, new_cities_vs_2025, top_destination, home_base, farthest_destination, rarest_destination, top_route, top_route_trips, top_3_routes, top_route_rank, top_route_src_lat, top_route_src_lon, top_route_dst_lat, top_route_dst_lon, fav_boarding_point_id, fav_dropping_point_id, night_trips_pct, top_departure_hour, fav_travel_day, weekend_pct, earliest_departure, nights_on_bus, avg_lead_days, closest_booking_minutes, usual_booking_hour, cancellations, app_pct, top_seat, sleeper_pct, ac_pct, fav_operator, fav_bus_type, total_saved_inr, savings_equivalent_tickets, best_deal_inr, best_deal_route, cheapest_ticket_inr, solo_pct, trips_since_2025, km_since_2025, ratings_given, co2_saved_kg, tree_equivalent, archetype, signature_trip, weekly_heatmap]
      properties:
        rb_user_id: { type: integer, format: int64, description: "BIGINT. Primary key. Logged-in redBus user id (rb_user_id > 0). One row per user." }
        trips: { type: integer, format: int64, description: "BIGINT. Count of confirmed India bus bookings (event_type=101) with journey date in 2026 IST. Cancelled tickets still count. Eligible users have trips > 20." }
        seats_booked: { type: integer, format: int64, description: "BIGINT. Sum of seats on those 2026 trips (COALESCE(seat_count,1))." }
        trips_2025: { type: integer, format: int64, description: "BIGINT. Same trip definition for journey dates in 2025 IST." }
        trips_change_pct: { type: number, nullable: true, description: "DOUBLE. Percent change vs 2025: 100*(trips-trips_2025)/trips_2025; NULL if no 2025 trips." }
        busiest_month: { type: integer, format: int64, description: "BIGINT. Calendar month (1-12, IST) with the most 2026 trips." }
        longest_gap_days: { type: integer, format: int64, nullable: true, description: "BIGINT. Longest gap in days between consecutive distinct 2026 travel days." }
        streak_days: { type: integer, format: int64, description: "BIGINT. Longest run of consecutive calendar days with at least one trip." }
        streak_weeks: { type: integer, format: int64, description: "BIGINT. Longest run of consecutive weeks with at least one trip." }
        streak_months: { type: integer, format: int64, description: "BIGINT. Longest run of consecutive months with at least one trip." }
        trips_percentile: { type: number, nullable: true, description: "DOUBLE. Percentile (0-100) of trip count within the eligible (>20 trips) cohort." }
        first_trip_date: { type: string, format: date-time, description: "DATE. Date of earliest 2026 journey (IST). Served as an ISO date-time at midnight UTC, e.g. 2026-02-25T00:00:00Z." }
        first_trip_route: { type: string, description: "STRING. Route of first 2026 trip: '{source} to {destination}'." }
        last_trip_date: { type: string, format: date-time, description: "DATE. Date of latest 2026 journey (IST), including future journeys. Served as an ISO date-time at midnight UTC, e.g. 2026-02-25T00:00:00Z." }
        last_trip_route: { type: string, description: "STRING. Route of last 2026 trip." }
        total_km: { type: number, description: "DOUBLE. Total km travelled. Joins lis.distance_registry on city ids; missing routes use India average distance." }
        earth_laps: { type: number, description: "DOUBLE. total_km / 40075 (Earth equatorial circumference)." }
        longest_trip_route: { type: string, description: "STRING. Route of the longest single trip by km." }
        longest_trip_km: { type: number, description: "DOUBLE. Km of the longest single trip." }
        shortest_trip_route: { type: string, description: "STRING. Route of the shortest single trip by km." }
        shortest_trip_km: { type: number, description: "DOUBLE. Km of the shortest single trip." }
        avg_trip_km: { type: number, description: "DOUBLE. Average km per 2026 trip." }
        km_estimated_trips: { type: integer, format: int64, description: "BIGINT. Number of trips that used average-distance fallback (no registry match)." }
        unique_cities: { type: integer, format: int64, description: "BIGINT. Distinct origin/destination city ids visited in 2026." }
        new_cities_vs_2025: { type: integer, format: int64, description: "BIGINT. City ids visited in 2026 but not in 2025." }
        top_destination: { type: string, description: "STRING. Most visited destination city name." }
        home_base: { type: string, description: "STRING. Most frequent origin city name (inferred home)." }
        farthest_destination: { type: string, description: "STRING. Destination of the longest trip (farthest by km)." }
        rarest_destination: { type: string, nullable: true, description: "STRING. User destination with the fewest distinct travellers in 2026 India population." }
        top_route: { type: string, description: "STRING. Most travelled '{source} to {destination}' route." }
        top_route_trips: { type: integer, format: int64, description: "BIGINT. Trip count on top_route." }
        top_3_routes: { type: string, description: "STRING. Top 3 routes with counts, semicolon-separated." }
        top_route_rank: { type: integer, format: int64, nullable: true, description: "BIGINT. Rank among all 2026 travellers on top_route by trip count (1=most)." }
        top_route_src_lat: { type: number, nullable: true, description: "DOUBLE. Latitude of top_route origin (map trail)." }
        top_route_src_lon: { type: number, nullable: true, description: "DOUBLE. Longitude of top_route origin." }
        top_route_dst_lat: { type: number, nullable: true, description: "DOUBLE. Latitude of top_route destination." }
        top_route_dst_lon: { type: number, nullable: true, description: "DOUBLE. Longitude of top_route destination." }
        fav_boarding_point_id: { type: integer, format: int64, nullable: true, description: "BIGINT. Most used boarding_point_id." }
        fav_dropping_point_id: { type: integer, format: int64, nullable: true, description: "BIGINT. Most used dropping_point_id." }
        night_trips_pct: { type: number, description: "DOUBLE. Share of trips boarding 21:00–04:59 IST (%)." }
        top_departure_hour: { type: integer, format: int64, description: "BIGINT. Most common boarding hour 0–23 IST." }
        fav_travel_day: { type: string, description: "STRING. Most common weekday of boarding (e.g. Saturday)." }
        weekend_pct: { type: number, description: "DOUBLE. Share of trips boarding Sat/Sun (%)." }
        earliest_departure: { type: string, description: "STRING. Earliest boarding clock time HH:mm IST." }
        nights_on_bus: { type: integer, format: int64, description: "BIGINT. Trips whose boarding + route duration crosses midnight IST." }
        avg_lead_days: { type: number, nullable: true, description: "DOUBLE. Average days from booking (date_of_issue) to journey/boarding." }
        closest_booking_minutes: { type: integer, format: int64, nullable: true, description: "BIGINT. Shortest non-negative booking-to-boarding gap (minutes)." }
        usual_booking_hour: { type: integer, format: int64, description: "BIGINT. Most common booking hour 0–23 IST." }
        cancellations: { type: integer, format: int64, description: "BIGINT. Count of 2026 tickets also present in bus_cancellation_events (event_type=201)." }
        app_pct: { type: number, description: "DOUBLE. Share of trips where sales_channel contains 'app' (%)." }
        top_seat: { type: string, nullable: true, description: "STRING. Most booked seat label (first seat on multi-seat tickets)." }
        sleeper_pct: { type: number, description: "DOUBLE. Share of sleeper trips (%)." }
        ac_pct: { type: number, description: "DOUBLE. Share of AC trips (%)." }
        fav_operator: { type: string, nullable: true, description: "STRING. Most used operator name (service_provider_name)." }
        fav_bus_type: { type: string, description: "STRING. Most used '{AC|Non-AC} {Sleeper|Seater}' label." }
        total_saved_inr: { type: number, description: "DOUBLE. Sum of discount amounts across 2026 trips (INR)." }
        savings_equivalent_tickets: { type: number, nullable: true, description: "DOUBLE. total_saved_inr / average per-seat fare." }
        best_deal_inr: { type: number, nullable: true, description: "DOUBLE. Largest single discount (INR)." }
        best_deal_route: { type: string, nullable: true, description: "STRING. Route where best_deal_inr occurred." }
        cheapest_ticket_inr: { type: number, nullable: true, description: "DOUBLE. Lowest positive per-seat fare (ticket_fare/seats)." }
        solo_pct: { type: number, description: "DOUBLE. Share of trips with exactly 1 seat (%)." }
        trips_since_2025: { type: integer, format: int64, description: "BIGINT. trips + trips_2025." }
        km_since_2025: { type: number, description: "DOUBLE. total_km + 2025 km." }
        ratings_given: { type: integer, format: int64, description: "BIGINT. 2026 trips with a matching ugc.ratings row on tin." }
        co2_saved_kg: { type: number, description: "DOUBLE. total_km * 0.10 (kg CO2 vs driving)." }
        tree_equivalent: { type: number, description: "DOUBLE. co2_saved_kg / 21." }
        archetype: { type: string, description: "STRING. Persona: Night Owl | Last-Minute Dasher | Planner | Sleeper Loyalist | Weekend Wanderer | Steady Traveller." }
        signature_trip: { type: string, description: "STRING. Most common 'route | hour | seat type | operator'." }
        weekly_heatmap: { type: string, description: "STRING. JSON string of week_number → trip_count for 2026." }
      example:
        rb_user_id: 42
        trips: 17
        seats_booked: 18
        trips_2025: 27
        trips_change_pct: -37
        busiest_month: 8
        longest_gap_days: 28
        streak_days: 2
        streak_weeks: 8
        streak_months: 9
        trips_percentile: 70.6
        first_trip_date: "2026-01-25T00:00:00Z"
        first_trip_route: "Mumbai to Varanasi"
        last_trip_date: "2026-09-12T00:00:00Z"
